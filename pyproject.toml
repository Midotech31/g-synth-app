# Packaging configuration for the standalone scientific engine.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsynth-engine"
dynamic = ["version"]
description = "PCR-free gene synthesis and cloning design with verified in-silico assembly"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Mohamed Merzoug", email = "mohamed.merzoug.essbo@gmail.com" },
]
keywords = [
    "bioinformatics",
    "gene-synthesis",
    "molecular-cloning",
    "codon-optimisation",
    "restriction-enzymes",
    "synthetic-biology",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Biopython provides independent validation in the test suite.
test = ["pytest>=8.0", "pytest-cov>=5.0", "biopython>=1.83"]

[project.urls]
Homepage = "https://github.com/Midotech31/g-synth-app"
Repository = "https://github.com/Midotech31/g-synth-app"
Issues = "https://github.com/Midotech31/g-synth-app/issues"

[tool.setuptools]
packages = ["gsynth_engine"]

[tool.setuptools.dynamic]
version = { attr = "gsynth_engine.__version__" }

[tool.setuptools.package-data]
gsynth_engine = ["data/*.json", "vector_data/*.json"]
