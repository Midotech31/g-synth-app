# Validate the scientific engine, API, and web interface independently.

name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

jobs:
  engine:
    name: Engine (the biology)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test
        run: pytest gsynth_engine/tests -q

      - name: Coverage gate
        run: pytest gsynth_engine/tests -q --cov=gsynth_engine --cov-fail-under=95

  api:
    name: API (the HTTP layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gsynth
          POSTGRES_PASSWORD: gsynth
          POSTGRES_DB: gsynth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsynth"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Lint (ruff)
        working-directory: .
        run: ruff check .

      - name: Migrations are complete
        env:
          DJANGO_SECRET_KEY: ci
          DATABASE_URL: postgresql://gsynth:gsynth@localhost:5432/gsynth
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        env:
          DJANGO_SECRET_KEY: ci
        run: pytest -q

  web:
    name: Web (the interface)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit web dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser workflow and accessibility
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_app/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install API dependencies
        run: pip install -r django_app/requirements.txt

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        working-directory: django_app
        run: python manage.py migrate --noinput

      - name: Test browser workflow
        env:
          PYTHON_BIN: python
        working-directory: frontend
        run: npm run test:e2e
