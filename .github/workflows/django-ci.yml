name: Django CI

on:
  push:
    branches: [main, "claude/**"]
    paths: ["django_app/**", ".github/workflows/**"]
  pull_request:
    paths: ["django_app/**"]

defaults:
  run:
    working-directory: django_app

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gsynth
          POSTGRES_PASSWORD: gsynth
          POSTGRES_DB: gsynth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsynth"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations dry-run
        env:
          DJANGO_SECRET_KEY: ci
          DATABASE_URL: postgresql://gsynth:gsynth@localhost:5432/gsynth
        run: python manage.py makemigrations --check --dry-run

      - name: Test (pytest, SQLite)
        env:
          DJANGO_SECRET_KEY: ci
        run: pytest
