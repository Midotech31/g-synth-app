# Render blueprint for the G-Synth Django API.
#
# Render reads this file automatically when you create a Blueprint from the
# repository, so the only value you have to supply by hand is DATABASE_URL
# (marked `sync: false` below — Render prompts for it during setup).
#
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
# Full walkthrough: django_app/DEPLOY.md

services:
  - type: web
    name: gsynth-api
    runtime: python
    plan: free
    region: frankfurt          # closest free region to Oran
    rootDir: django_app
    branch: claude/django-rewrite

    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --access-logfile -"

    # Render restarts the service if this stops returning 2xx. The path is
    # exempt from SECURE_SSL_REDIRECT (see config/settings/prod.py) so the
    # plain-HTTP internal probe isn't answered with a redirect.
    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      # Render generates a strong random value and keeps it stable across
      # deploys. config.settings.prod refuses to boot without it.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Resolves to this service's own .onrender.com hostname.
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: gsynth-api
          property: host

      # No browser frontend yet — the React SPA (Phase 1) gets added here.
      - key: CORS_ALLOWED_ORIGINS
        value: ""

      # Postgres connection string. Render will ask you for this when you
      # create the blueprint: paste the Supabase "Session pooler" URL.
      # Required — without it the app refuses to start rather than silently
      # falling back to a SQLite file that every redeploy would erase.
      - key: DATABASE_URL
        sync: false
