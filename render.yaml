# Render blueprint for the G-Synth API and static web application.
# Deployment guide: django_app/DEPLOY.md

services:
  # API
  - type: web
    name: gsynth-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: django_app
    branch: main

    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --access-logfile -"

    # Internal health endpoint exempt from HTTPS redirection.
    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: gsynth-api-c2p9.onrender.com

      - key: CORS_ALLOWED_ORIGINS
        value: https://gsynth-app.onrender.com

      # Optional private study assistant; core scientific tools are independent.
      - key: TUTOR_ENABLED
        value: "false"

      # Required PostgreSQL connection string.
      - key: DATABASE_URL
        sync: false

  # Static web application
  - type: web
    name: gsynth-app
    runtime: static
    rootDir: frontend
    branch: main

    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist

    # Serve client-side routes through the application shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "22.22.2"

      # Public API origin embedded at build time.
      - key: VITE_API_BASE
        value: https://gsynth-api-c2p9.onrender.com
