[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "DJ",      # django
]
ignore = [
    "E501",    # line-length handled by formatter
    "DJ001",   # nullable text fields are fine here (we default to "")
]
