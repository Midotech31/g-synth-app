# Local development: Django + Postgres + Redis
# Run with: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gsynth
      POSTGRES_PASSWORD: gsynth
      POSTGRES_DB: gsynth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsynth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Pull the model once Ollama is healthy. Runs to completion, then exits —
  # it is not a long-lived service, just a one-shot init step so users never
  # have to run `ollama pull` by hand.
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "echo 'Pulling llama3.1 — first run may take a few minutes…' &&
             curl -sf http://ollama:11434/api/pull -d '{\"name\":\"llama3.1\"}' &&
             echo 'Model ready.'"

  api:
    build: .
    # The image's default CMD runs gunicorn (correct for production). For
    # local development we mount the source below, so use runserver instead
    # — gunicorn would not pick up edits without a manual restart.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-only-do-not-use-in-prod
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DATABASE_URL: postgresql://gsynth:gsynth@db:5432/gsynth
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      OLLAMA_BASE_URL: "http://ollama:11434"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
  ollama_models:
